[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turkanime-mcp"
version = "1.0.0"
description = "TürkAnime İndirici — Claude Desktop MCP Sunucusu"
authors = [{ name = "Türker Yakup" }]
license = { text = "CC-BY-NC-ND-4.0" }
readme = "README.md"
requires-python = ">=3.10"
keywords = ["mcp", "turkanime", "anime", "downloader", "claude"]

dependencies = [
    # MCP Framework (FastMCP wraps official SDK)
    "fastmcp>=3.0.0",
    
    # TürkAnime Core (includes yt-dlp, curl-cffi, pycryptodome)
    "turkanime-cli>=10.0.3",
    
    # FFmpeg Fallback (auto-bundled; system ffmpeg preferred via PATH)
    "imageio-ffmpeg>=0.4.9",
    
    # Windows stdio support (mcp SDK requirement)
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Repository = "https://github.com/TurkerYakup/mcp-server-turkanime-indirici"
Documentation = "https://github.com/TurkerYakup/mcp-server-turkanime-indirici/blob/main/README.md"

[tool.setuptools]
py-modules = ["turkanime_mcp"]
